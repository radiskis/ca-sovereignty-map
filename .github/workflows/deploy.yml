name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'methodology.html'
      - 'css/**'
      - 'js/**'
      - 'data.min.json'
      - 'nordic-municipalities.topojson'

  workflow_dispatch:

# Minimal permissions: read source + write pages token only
permissions:
  contents: read
  pages: write
  id-token: write

# Share the `pages` concurrency lane with nightly.yml. cancel-in-progress=false
# ensures a static-asset push never kills an in-progress (potentially 30 min)
# nightly scan; the deploy simply queues.
concurrency:
  group: pages
  cancel-in-progress: false

# Opt into Node.js 24 now to avoid forced migration noise in June 2026
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      # SHA-pinned to actions/checkout@v6.0.2 (Node 24)
      # https://github.com/actions/checkout/releases/tag/v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # SHA-pinned to actions/configure-pages@v6.0.0 (Node 24)
      # https://github.com/actions/configure-pages/releases/tag/v6.0.0
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      # SHA-pinned to actions/upload-pages-artifact@v5.0.0 (Node 24)
      # https://github.com/actions/upload-pages-artifact/releases/tag/v5.0.0
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: '.'   # Serve from repo root (index.html, data.min.json, css/, js/)

      # SHA-pinned to actions/deploy-pages@v5.0.0 (Node 24)
      # https://github.com/actions/deploy-pages/releases/tag/v5.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
