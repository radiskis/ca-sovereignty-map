name: Nightly CA Scan

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC = 04:00 Finnish time
  workflow_dispatch:       # Allow manual trigger

# The nightly run ends with an actions/deploy-pages step, so it shares the
# `pages` concurrency lane with deploy.yml. cancel-in-progress=false lets a
# static-asset deploy queue behind a long-running scan instead of killing it.
concurrency:
  group: pages
  cancel-in-progress: false

# Opt into Node.js 24 now to avoid forced migration noise in June 2026
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # Up to 2 h budget; accuracy matters more than speed

    # No push-to-main anymore: nightly deploys fresh scan data straight to
    # GitHub Pages. The repo-tracked data.json stays as a manually-maintained
    # baseline updated through the normal PR flow (see docs/branching.md);
    # the Pages site is authoritative for what users see.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      contents: read    # Read-only: we no longer commit to main
      pages: write      # Required by actions/deploy-pages
      id-token: write   # OIDC token for Pages deployment attestation

    steps:
      # SHA-pinned to actions/checkout@v6.0.2 (Node 24)
      # https://github.com/actions/checkout/releases/tag/v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # SHA-pinned to astral-sh/setup-uv@v8.1.0 (Node 24)
      # https://github.com/astral-sh/setup-uv/releases/tag/v8.1.0
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv python install 3.13

      - run: uv sync

      # Phase 2: Scan certificates (municipality_domains.json must exist)
      #
      # Tuning for GitHub Actions (Azure, US West) → Nordic/Baltic servers:
      #
      # --concurrency 15
      #   Low enough that crt.sh is never rate-limited from the CI IP range.
      #   The 2026-03-26 nightly showed 'stamina.retry_scheduled' storms when
      #   running at concurrency 30 with CT enabled — scan rate fell from
      #   ~6 dom/s to ~2.3 dom/s and 195 fewer municipalities were classified.
      #
      # --timeout 25
      #   GitHub Actions runs in Azure (US West); round-trip to Nordic servers
      #   is ~150-200 ms vs ~20 ms from Finland. The extra 10 s window catches
      #   servers that would time out at 15 s from CI but succeed from a local
      #   developer machine.
      #
      # CT enabled (no --skip-ct)
      #   Accuracy over speed. With concurrency 15 and no rate-limit pressure,
      #   crt.sh historical data adds CT log signals for borderline cases.
      #   Expected total run time: ~25-35 minutes (well within 120 min budget).
      - name: Scan TLS certificates
        run: uv run scan-certs --concurrency 15 --timeout 25

      - name: Run analysis report
        run: uv run analyze
        continue-on-error: true

      # Deploy the checked-out repo (with freshly regenerated data.json and
      # data.min.json in-place) to GitHub Pages. No commit back to main; the
      # live site is refreshed directly. If the scan produced no changes,
      # Pages simply serves the same bytes as yesterday.
      #
      # SHA-pinned to actions/configure-pages@v6.0.0 (Node 24)
      # https://github.com/actions/configure-pages/releases/tag/v6.0.0
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      # SHA-pinned to actions/upload-pages-artifact@v5.0.0 (Node 24)
      # https://github.com/actions/upload-pages-artifact/releases/tag/v5.0.0
      - name: Upload site artifact with fresh scan data
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: '.'   # Serve from repo root: index.html + fresh data.min.json

      # SHA-pinned to actions/deploy-pages@v5.0.0 (Node 24)
      # https://github.com/actions/deploy-pages/releases/tag/v5.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
